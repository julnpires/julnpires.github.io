<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Chat com Carla</title>
</head>
<body>
  <header class="app-header">
    <a class="back-btn" href="conversas.html" aria-label="Voltar">‹</a>
    <img src="https://img.icons8.com/ios-filled/24/user-female.png" alt="Perfil">
    <h1>Carla</h1>
  </header>

  <main>
    <div class="chat-header">Passeio agendado — Hoje 14:00</div>

    <div class="chat-list">
      <div class="walker-card bg-muted">
        <div><strong>Carla:</strong> Oi Juliana! Vi que você agendou um passeio com a Mel para hoje às 14h. Pode me contar um pouco sobre ela?</div>
      </div>
      <div class="walker-card">
        <div><strong>Você:</strong> Olá! Ela adora correr, mas precisa de guia.</div>
      </div>
    </div>

    <div class="spacer-sm"></div>
    <div class="chat-input">
      <input class="form-control" type="text" placeholder="Digite uma mensagem...">
      <button class="btn primary">Enviar</button>
    </div>
  </main>
  <nav class="bottom-nav">
    <a class="nav-item" href="perfil-pets.html">Configuração</a>
    <a class="nav-item" href="buscar-walkers.html">Buscar</a>
    <a class="nav-item" href="index.html">Início</a>
    <a class="nav-item active" href="conversas.html">Conversas</a>
    <a class="nav-item" href="perfil-pets.html">Perfil</a>
  </nav>
</body>
</html>
