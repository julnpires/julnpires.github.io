<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Adicionar Pet</title>
</head>
<body>
  <header class="app-header">
    <a class="back-btn" href="perfil-pets.html" aria-label="Voltar">‹</a>
    <h1>Adi Pet (+)</h1>
  </header>

  <main>
    <h2 class="section-title">Pré-visualização</h2>
    <div class="container-pad--tight">
      <div class="walker-card">
        <div class="walker-left">
          <div class="avatar-wrap">
            <img class="avatar" src="img/avatar1.svg" alt="Preview">
          </div>
          <div class="walker-info">
            <div class="walker-name">Mel <span class="small">4 anos · Médio</span></div>
            <div class="verified">Border Collie · Preto e Branco</div>
          </div>
        </div>
        <div class="price">&nbsp;</div>
      </div>
    </div>

    <div class="container-pad--tight">
      <label>Nome:</label><br>
      <input class="form-control" type="text" value="Mel"><br><br>

      <label>Espécie:</label><br>
      <select class="form-control">
        <option>Cachorro</option>
        <option>Gato</option>
        <option>Outro</option>
      </select><br><br>

      <label>Raça:</label><br>
      <input class="form-control" type="text" value="Border Collie"><br><br>

      <label>Porte:</label><br>
      <select class="form-control">
        <option>Pequeno</option>
        <option selected>Médio</option>
        <option>Grande</option>
      </select><br><br>

      <label>Cor/Pelagem:</label><br>
      <input class="form-control" type="text" value="Preto e Branco"><br><br>

      <label>Comportamento:</label><br>
      <select class="form-control">
        <option>Agitado</option>
        <option selected>Amigável</option>
        <option>Tímido</option>
      </select><br><br>

      <label>Idade:</label><br>
      <input class="form-control" type="text" value="4 anos"><br><br>

      <div class="action-row">
        <a class="btn primary" href="perfil-pet.html">Salvar Pet</a>
        <a class="btn" href="perfil-pets.html">Cancelar</a>
      </div>
    </div>
  </main>
</body>
</html>
