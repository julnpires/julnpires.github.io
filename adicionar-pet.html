<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Adicionar Pet</title>
</head>
<body>
  <header class="app-header">
    <a class="back-btn" href="perfil-pets.html">‹</a>
    <img src="https://img.icons8.com/ios-filled/24/menu--v1.png" alt="Menu">
    <h1>Adi Pet (+)</h1>
  </header>

  <main>
    <h2 style="padding:0 1.25rem; color:var(--cor-texto-leve); font-size:0.95rem;">Pré-visualização</h2>
    <div style="padding:0 1.25rem 1rem 1.25rem;">
      <div class="walker-card">
        <div class="walker-left">
          <div class="avatar-wrap">
            <img class="avatar" src="img/avatar1.svg" alt="Preview">
          </div>
          <div class="walker-info">
            <div class="walker-name">Mel <span class="small">4 anos · Médio</span></div>
            <div class="verified">Border Collie · Preto e Branco</div>
          </div>
        </div>
        <div class="price">&nbsp;</div>
      </div>
    </div>

    <div style="padding:0 1.25rem;">
      <label>Nome:</label><br>
      <input type="text" value="Mel" style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);"><br><br>

      <label>Espécie:</label><br>
      <select style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);">
        <option>Cachorro</option>
        <option>Gato</option>
        <option>Outro</option>
      </select><br><br>

      <label>Raça:</label><br>
      <input type="text" value="Border Collie" style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);"><br><br>

      <label>Porte:</label><br>
      <select style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);">
        <option>Pequeno</option>
        <option selected>Médio</option>
        <option>Grande</option>
      </select><br><br>

      <label>Cor/Pelagem:</label><br>
      <input type="text" value="Preto e Branco" style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);"><br><br>

      <label>Comportamento:</label><br>
      <select style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);">
        <option>Agitado</option>
        <option selected>Amigável</option>
        <option>Tímido</option>
      </select><br><br>

      <label>Idade:</label><br>
      <input type="text" value="4 anos" style="width:100%;padding:0.6rem;border-radius:0.5rem;border:0.0625rem solid rgba(0,0,0,0.06);"><br><br>

      <div style="display:flex;gap:0.75rem;">
        <a class="btn primary" href="perfil-pet.html">Salvar Pet</a>
        <a class="btn" href="perfil-pets.html">Cancelar</a>
      </div>
    </div>
  </main>
</body>
</html>
