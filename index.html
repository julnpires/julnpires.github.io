<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Início</title>
</head>
<body>
  <header class="app-header">
    <h1>Buscar</h1>
  </header>

  <main>
    <div class="search-wrapper">
      <input class="search" type="search" placeholder="Precisa de um passeio agora?">
    </div>

    <div class="chips" role="tablist" aria-label="Filtros">
      <button class="chip active" aria-pressed="true">🐾 Passeio</button>
      <button class="chip">🏠 Hospedagem</button>
      <button class="chip">✂️ Banho</button>
      <button class="chip">🩺 Vet</button>
    </div>

    <h2 class="section-title">Sugeridos para você</h2>

    <ul class="walkers">
      <li>
        <a class="card-link" href="detalhes-walker.html">
          <div class="walker-card">
            <div class="walker-left">
              <div class="avatar-wrap">
                <img class="avatar" src="img/avatar1.svg" alt="Fiona A.">
                <span class="status-dot" aria-hidden="true"></span>
              </div>
              <div class="walker-info">
                <div class="walker-name">Fiona A. <span class="small">★4.9 · 2km</span></div>
                <div class="verified">✓ Verificada</div>
              </div>
            </div>
            <div class="price">R$45</div>
          </div>
        </a>
      </li>

      <li>
        <a class="card-link" href="detalhes-walker.html">
          <div class="walker-card">
            <div class="walker-left">
              <div class="avatar-wrap">
                <img class="avatar" src="img/avatar2.svg" alt="Carlos M.">
                <span class="status-dot" aria-hidden="true"></span>
              </div>
              <div class="walker-info">
                <div class="walker-name">Carlos M. <span class="small">★4.7 · 1.4km</span></div>
                <div class="verified">✓ Verificada</div>
              </div>
            </div>
            <div class="price">R$30</div>
          </div>
        </a>
      </li>

      <li>
        <a class="card-link" href="detalhes-walker.html">
          <div class="walker-card">
            <div class="walker-left">
              <div class="avatar-wrap">
                <img class="avatar" src="img/avatar3.svg" alt="Duda S.">
                <span class="status-dot" aria-hidden="true"></span>
              </div>
              <div class="walker-info">
                <div class="walker-name">Duda S. <span class="small">★4.7 · 3.5km</span></div>
                <div class="verified">✓ Verificada</div>
              </div>
            </div>
            <div class="price">R$32</div>
          </div>
        </a>
      </li>
    </ul>

    <div class="cta-group">
      <a class="btn primary" href="buscar-walkers.html">Fazer Reserva</a>
      <a class="btn danger" href="#">Emergência</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="perfil-pets.html">Configuração</a>
    <a class="nav-item" href="buscar-walkers.html">Buscar</a>
    <a class="nav-item active" href="index.html">Início</a>
    <a class="nav-item" href="conversas.html">Conversas</a>
    <a class="nav-item" href="perfil-pets.html">Perfil</a>
  </nav>
</body>
</html>
